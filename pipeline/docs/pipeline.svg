<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1500" height="1060" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172c43}.title{font-size:32px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style><text x="55" y="60" class="title">Regesten-RDF: Datenerzeugung und Prüfung</text><text x="55" y="95" class="body">Privater Pilot, 9. November 2026. Fachliche Abnahme steht aus.</text><rect x="55" y="125" width="1390" height="100" rx="12" fill="#e8effa" stroke="#bac8d7" stroke-width="2"/><text x="75" y="160" class="head">Eingefrorene Vorgaben</text><text x="75" y="192" class="body">CIDOC-CRM-Profil, kontrollierte Begriffe, Annotationsregeln, Prompts und SHACL</text><text x="75" y="218" class="body">Versionen und Hashes im Manifest. Modelländerungen erst im nächsten Durchlauf.</text><rect x="55" y="270" width="420" height="140" rx="12" fill="#e6f2ef" stroke="#bac8d7" stroke-width="2"/><text x="75" y="305" class="head">1  CSV und Vorbereitung</text><text x="75" y="337" class="body">Quellen und Textderivate prüfen</text><text x="75" y="363" class="body">Hashes, IDs und Aufgabenpakete</text><text x="75" y="389" class="body">Deterministisch mit Python</text><rect x="540" y="270" width="420" height="140" rx="12" fill="#eee8f8" stroke="#bac8d7" stroke-width="2"/><text x="560" y="305" class="head">2  Extraktion im AI harness</text><text x="560" y="337" class="body">Begrenzte Subagent-Aufträge</text><text x="560" y="363" class="body">Quellenbelegte Aussagen als Turtle</text><text x="560" y="389" class="body">Explizite Enthaltung oder Fehler</text><rect x="1025" y="270" width="420" height="140" rx="12" fill="#e6f2ef" stroke="#bac8d7" stroke-width="2"/><text x="1045" y="305" class="head">3  Technische Prüfung</text><text x="1045" y="337" class="body">RDF-Parsing und SHACL</text><text x="1045" y="363" class="body">Textbelege, IDs, Aufgabenabdeckung</text><text x="1045" y="389" class="body">Originale und Fehler behalten</text><path d="M475 340 H540" class="arrow"/><path d="M960 340 H1025" class="arrow"/><rect x="1025" y="475" width="420" height="140" rx="12" fill="#eee8f8" stroke="#bac8d7" stroke-width="2"/><text x="1045" y="510" class="head">4  Unabhängiger Quellenreview</text><text x="1045" y="542" class="body">LLM-as-a-judge liest Text und RDF</text><text x="1045" y="568" class="body">Überbehauptungen und Auslassungen</text><text x="1045" y="594" class="body">Befunde ohne stilles Umschreiben</text><path d="M1235 410 V475" class="arrow"/><rect x="540" y="475" width="420" height="140" rx="12" fill="#eee8f8" stroke="#bac8d7" stroke-width="2"/><text x="560" y="510" class="head">5  Befunde prüfen und korrigieren</text><text x="560" y="542" class="body">Review gegen Vertrag abgleichen</text><text x="560" y="568" class="body">Korrektur schreibt eigene Fassung</text><text x="560" y="594" class="body">Ontologie bleibt eingefroren</text><path d="M1025 545 H960" class="arrow"/><rect x="55" y="475" width="420" height="140" rx="12" fill="#e6f2ef" stroke="#bac8d7" stroke-width="2"/><text x="75" y="510" class="head">6  Erneut prüfen</text><text x="75" y="542" class="body">Gleiche deterministische Checks</text><text x="75" y="568" class="body">Gezielter Review offener Befunde</text><text x="75" y="594" class="body">Begrenzte Korrekturschleife</text><path d="M540 545 H475" class="arrow"/><rect x="55" y="690" width="650" height="140" rx="12" fill="#fff0d6" stroke="#bac8d7" stroke-width="2"/><text x="75" y="725" class="head">7  Ergebnisse fachlich lesen</text><text x="75" y="757" class="body">Regest, Turtle, Textbelege und Prüfbefunde nebeneinander</text><text x="75" y="783" class="body">Experte prüft Aussagen, Auslassungen und Modellpassung</text><text x="75" y="809" class="body">Abnahme wird ausdrücklich dokumentiert</text><path d="M265 615 V690" class="arrow"/><rect x="785" y="690" width="660" height="140" rx="12" fill="#fff" stroke="#bac8d7" stroke-width="2"/><text x="805" y="725" class="head">8  Freigegebener Forschungsgraph</text><text x="805" y="757" class="body">Erst nach fachlicher Abnahme</text><text x="805" y="783" class="body">Abfragen und spätere Werkzeugdemo</text><text x="805" y="809" class="body">Öffentliche Ausgabe benötigt eigene Freigabe</text><path d="M705 760 H785" class="arrow"/><text x="55" y="895" class="head">Sichtbare Ergebnisse</text><text x="55" y="930" class="body">packets/  →  extracted/  →  review/  →  revised/  →  validation/</text><text x="55" y="966" class="body">Technisch bestanden bedeutet Konformität mit den implementierten Checks.</text><text x="55" y="998" class="body">Historische Richtigkeit und Vollständigkeit benötigen die fachliche Prüfung.</text></svg>