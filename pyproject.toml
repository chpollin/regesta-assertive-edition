# Script pipeline of the edition: the root scripts share edition_io.py and register_names.py
# and one dependency set. The project is never installed. The scripts in pipeline/ keep their
# own PEP 723 blocks, because their hashes are recorded in manifests and validation reports,
# and uv runs a script with inline metadata in its own environment.
[project]
name = "regesta-assertive-edition"
version = "0"
requires-python = ">=3.11"
# Pinned to the versions the frozen runs and the checks were built with.
dependencies = [
    "rdflib==7.6.0",
    "pyshacl==0.40.1",
    "lxml==6.1.3",
    "numpy==2.4.6",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["checks"]
